<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WordSnap</title>

    <link rel="stylesheet" href="style.css">

    <!-- OCR 라이브러리 -->
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<header>

    <h1>📚 WordSnap</h1>

    <p class="subtitle">
        사진 한 장으로 만드는 나만의 영단어 암기장
    </p>

</header>

<main>

    <!-- 사진 업로드 -->

    <section class="upload-section">

        <label class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*">

            <div>

                <span class="camera">
                    📷
                </span>

                <h3>
                    단어장 사진 업로드
                </h3>

                <p>
                    손글씨 단어장을 선택하세요.
                </p>

            </div>

        </label>

    </section>

    <!-- OCR 상태 -->

    <section class="status">

        <p id="statusText">
            사진을 선택해주세요.
        </p>

    </section>

    <!-- 랜덤 단어 -->

    <section>

        <div class="title-row">

            <h2>
                오늘의 단어
            </h2>

            <button id="shuffleBtn">
                🎲 랜덤 5개
            </button>

        </div>

        <div id="wordList">

            <!-- JavaScript가 자동 생성 -->

        </div>

    </section>

</main>

<footer>

    <p>

        WordSnap V1

    </p>

</footer>

<script src="storage.js"></script>
<script src="ocr.js"></script>
<script src="script.js"></script>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
